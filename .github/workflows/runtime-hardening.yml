name: Runtime Hardening

on:
  pull_request:
    paths:
      - "taichi_vision/backend_config.py"
      - "taichi_vision/device_selection.py"
      - "taichi_vision/taichi_aot/**"
      - "taichi_vision/taichi_algorithm/aot_py/**"
      - ".github/workflows/runtime-hardening.yml"
  push:
    branches: [main]
    paths:
      - "taichi_vision/backend_config.py"
      - "taichi_vision/device_selection.py"
      - "taichi_vision/taichi_aot/**"
      - "taichi_vision/taichi_algorithm/aot_py/**"
      - ".github/workflows/runtime-hardening.yml"

permissions:
  contents: read

jobs:
  cpu-safe-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime test dependencies
        run: >-
          python -m pip install --disable-pip-version-check pytest
          "taichi>=1.7.4" "numpy>=2.0.0"

      - name: Compile runtime Python sources
        run: |
          python -m compileall -q \
            taichi_vision/backend_config.py \
            taichi_vision/device_selection.py \
            taichi_vision/taichi_aot

      - name: Run CPU-safe hardening regressions
        run: python -m pytest -q taichi_vision/taichi_aot/tests
